quarkus.application.name=auth-service
quarkus.http.port=${PORT:8080}

# Database: Flyway owns the schema, Hibernate never generates DDL.
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# JWT: tokens are signed with a private key and verified with the public one.
# Keys are never committed; dev/test generate or inject them (see tests).
auth.jwt.issuer=${JWT_ISSUER:http://localhost:8080}
mp.jwt.verify.issuer=${auth.jwt.issuer}
smallrye.jwt.new-token.issuer=${auth.jwt.issuer}

# %dev / %test: no datasource url, Quarkus Dev Services starts a throwaway PostgreSQL.
# In CI without docker socket, set QUARKUS_DATASOURCE_DEVSERVICES_ENABLED=false and QUARKUS_DATASOURCE_JDBC_URL.
%dev.quarkus.hibernate-orm.log.sql=true
%test.quarkus.log.level=WARN

# %prod: everything comes from the environment, startup fails if something is missing.
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
